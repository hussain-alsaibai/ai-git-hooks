[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-git-hooks"
version = "0.1.0"
description = "AI-powered Git hooks for automated code review and security scanning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Hussain AlSaibai", email = "hussain.alsaibai@gmail.com"}
]
keywords = ["git", "hooks", "ai", "llm", "security", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "rich>=13.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff==0.17.5",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
aigh = "ai_git_hooks.cli:main"

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/ai-git-hooks"
Repository = "https://github.com/hussain-alsaibai/ai-git-hooks"
Issues = "https://github.com/hussain-alsaibai/ai-git-hooks/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
# Pin the rule set so a ruff upgrade cannot silently change what CI enforces.
# CI installs this exact version from the dev extras.
target-version = "py38"
line-length = 100
