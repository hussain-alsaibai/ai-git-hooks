name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.8 and ruff target-version py38
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned ruff changed the enforced ruleset between runs,
          # so a green local lint and a red CI lint could both be "correct".
          python -m pip install pytest ruff==0.17.5
          python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
